name: Build Buggy Ragdoll All-In-One

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          if [ ! -f libBuggyRagdoll.so ]; then
            echo "ERROR: libBuggyRagdoll.so not found"
            exit 1
          fi

          if [ ! -f patch.py ]; then
            echo "ERROR: patch.py not found"
            exit 1
          fi

      - name: Apply All-In-One Patch
        run: |
          python3 patch.py

          echo "Checking patched library..."

          if [ ! -f libBuggyRagdoll_allfix_test.so ]; then
            echo "ERROR: All-In-One patch did not create the output file"
            exit 1
          fi

          ls -lh libBuggyRagdoll_allfix_test.so

      - name: Package patched library
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp libBuggyRagdoll_allfix_test.so artifact/

          if [ -f README.md ]; then
            cp README.md artifact/
          fi

          cd artifact
          zip -r ../Buggy-Ragdoll-AllInOne.zip .

          cd ..

          echo "Package created:"
          ls -lh Buggy-Ragdoll-AllInOne.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buggy-Ragdoll-AllInOne
          path: Buggy-Ragdoll-AllInOne.zip
          if-no-files-found: error
